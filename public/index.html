<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdoLina AI Logistics Engine</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        header { background-color: #2c3e50; color: white; padding: 1rem; text-align: center; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #2980b9; }
        .status { font-weight: bold; color: #27ae60; }
        .health { margin-top: 2rem; border-top: 1px solid #ddd; padding-top: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #34495e; color: white; }
    </style>
</head>
<body>
    <header>
        <h1>AdoLina AI Logistics Engine</h1>
    </header>
    <div class="container">
        <h2>System Adapters</h2>
        <div id="adapters" class="grid">
            <p>Loading adapters...</p>
        </div>

        <h2>Logistics Tasks (from Database)</h2>
        <table id="tasks-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Task</th>
                    <th>Adapter</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tasks-body">
                <tr><td colspan="4">Loading tasks...</td></tr>
            </tbody>
        </table>

        <div class="health">
            <h2>System Health</h2>
            <p id="health-status">Checking status...</p>
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                // Fetch status and adapters
                const response = await fetch('/', { headers: { 'Accept': 'application/json' } });
                const data = await response.json();

                const adapterList = document.getElementById('adapters');
                adapterList.innerHTML = '';

                data.adapters.forEach(adapter => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${adapter.name}</h3>
                        <p>${adapter.description}</p>
                        <span class="status">● Active</span>
                    `;
                    adapterList.appendChild(card);
                });

                // Fetch tasks from database
                const tasksRes = await fetch('/api/tasks');
                const tasks = await tasksRes.json();
                const tasksBody = document.getElementById('tasks-body');
                tasksBody.innerHTML = '';
                tasks.forEach(task => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${task.id}</td>
                        <td>${task.task}</td>
                        <td>${task.adapter}</td>
                        <td>${task.status}</td>
                    `;
                    tasksBody.appendChild(row);
                });

                // Fetch health
                const healthRes = await fetch('/health');
                const healthData = await healthRes.json();
                document.getElementById('health-status').innerText = `Status: ${healthData.status} | DB: ${healthData.database} | Last Check: ${healthData.timestamp}`;
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
